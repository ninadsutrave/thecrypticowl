name: Benchmark · cryptic models

# Manual: gives every model we have a key for the same letter quiz and the
# same cryptic clue tasks, checks the results in code and prints a summary.
# Stores nothing. Add GROQ_API_KEY, CEREBRAS_API_KEY, OPENROUTER_API_KEY or
# MISTRAL_API_KEY as repository secrets to include those providers.
on:
  workflow_dispatch:
    inputs:
      gemini_models:
        description: 'Gemini models (blank = default list)'
        default: ''

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix lambda
      - name: Compare
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          BENCH_GEMINI_MODELS: ${{ inputs.gemini_models }}
        run: node lambda/scripts/bench-cryptic.mjs
