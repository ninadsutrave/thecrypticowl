name: Preview · AI puzzles

# Manual: generate today's AI-written puzzles with the real code and this
# repo's key, print them with full logs, and store nothing. For checking
# quality, and for seeing why a Lambda's AI step fails.
on:
  workflow_dispatch:
    inputs:
      games:
        description: 'Space-separated: cryptic what-am-i trivia'
        default: 'cryptic what-am-i trivia'
      dates:
        description: 'Comma-separated dates (blank = today; not for cryptic)'
        default: ''
      used:
        description: 'Comma-separated source keys to avoid (e.g. wiki:Python)'
        default: ''

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix lambda
      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          GAMES: ${{ inputs.games }}
          DATES: ${{ inputs.dates }}
          PREVIEW_USED: ${{ inputs.used }}
        run: |
          # Same writers and checker as production (deploy-lambda-*.yml).
          for g in $GAMES; do
            case "$g" in
              what-am-i) model=qwen/qwen3.8-27b ;;
              *) model=openai/gpt-oss-120b ;;
            esac
            echo "::group::$g"
            AI_PROVIDER=groq JUDGE_PROVIDER=gemini GROQ_MODEL=$model \
              node lambda/scripts/preview.mjs "$g" $DATES || echo "!! $g exited with an error"
            echo "::endgroup::"
          done
