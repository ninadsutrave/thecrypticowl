name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # ── Static analysis over BOTH trees ─────────────────────────────────────────
  # `npm run lint` used to be `eslint src`, and Prettier only covered `src`.
  # The 2,600-line lambda/ tree was never checked at all. Both scripts now
  # cover `src lambda`.
  static:
    name: Lint, Format & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck

  # ── Tests, split by runtime so a failure names the right half ──────────────
  test:
    name: Test (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [lambda, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The contract test imports Lambda modules, which resolve lambda/ deps.
      - run: npm ci --prefix lambda
      - name: Run tests
        run: npx vitest run --project ${{ matrix.project }} --reporter=verbose

  # ── Coverage gate on the correctness core ──────────────────────────────────
  # The clue validator decides what ships as the day's puzzle. Thresholds in
  # vitest.config.ts fail the build if its coverage slips, so a new wordplay
  # mechanism cannot be added without tests.
  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The contract test imports Lambda modules, which resolve lambda/ deps.
      - run: npm ci --prefix lambda
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: 'https://placeholder.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'placeholder'

      # ── Bundle budget ────────────────────────────────────────────────────────
      # The initial payload is what every first-time visitor pays for. Without
      # a ceiling it only ever grows, and nobody notices until Lighthouse does.
      - name: Check bundle budget
        run: node scripts/check-bundle-budget.mjs

  # ── Every Lambda packages and imports on its own ───────────────────────────
  # One Lambda per game, each zipped from shared/ + its own directory. This
  # catches a game importing something outside its package (another game's
  # code, a missing dependency) before the deploy workflow ever runs.
  lambda-package:
    name: Package Lambda (${{ matrix.game }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game:
          [
            cryptic,
            sudoku,
            what-am-i,
            trivia,
            chronology,
            chess,
            cryptogram,
            slitherlink,
            higher-lower,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: lambda/package-lock.json
      - name: Package and import the handler
        run: bash lambda/scripts/package.sh ${{ matrix.game }} function.zip

  # ── Supply chain ────────────────────────────────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
