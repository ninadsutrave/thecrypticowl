name: Deploy Lambda · Checkmate

# chess.js move generation in the reviewer.

on:
  push:
    branches: [master]
    paths:
      - 'lambda/games/chess/**'
      - 'lambda/shared/**'
      - 'lambda/package.json'
      - 'lambda/package-lock.json'
      - 'lambda/scripts/package.sh'
      - '.github/workflows/deploy-lambda-chess.yml'
      - '.github/workflows/_deploy-game-lambda.yml'
  workflow_dispatch:
    inputs:
      skip_schedule:
        description: 'Skip reconciling the EventBridge schedule'
        type: boolean
        default: false

concurrency:
  group: deploy-lambda-chess
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-game-lambda.yml
    with:
      game: chess
      needs_ai: false
      timeout: 300
      memory: 512
      schedule: ${{ vars.CHESS_SCHEDULE || 'cron(10 3 * * ? *)' }}
      skip_schedule: ${{ inputs.skip_schedule || false }}
    secrets: inherit
