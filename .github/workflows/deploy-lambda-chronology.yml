name: Deploy Lambda · Chronology

on:
  push:
    branches: [master]
    paths:
      - 'lambda/games/chronology/**'
      - 'lambda/shared/**'
      - 'lambda/package.json'
      - 'lambda/package-lock.json'
      - 'lambda/scripts/package.sh'
      - '.github/workflows/deploy-lambda-chronology.yml'
      - '.github/workflows/_deploy-game-lambda.yml'
  workflow_dispatch:
    inputs:
      skip_schedule:
        description: 'Skip reconciling the EventBridge schedule'
        type: boolean
        default: false

concurrency:
  group: deploy-lambda-chronology
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-game-lambda.yml
    with:
      game: chronology
      needs_ai: true  # optional AI: screens events when a model key is set
      timeout: 300
      memory: 256
      schedule: ${{ vars.CHRONOLOGY_SCHEDULE || 'cron(5 3 * * ? *)' }}
      skip_schedule: ${{ inputs.skip_schedule || false }}
    secrets: inherit
