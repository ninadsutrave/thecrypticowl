name: Deploy Lambda · Cryptogram

on:
  push:
    branches: [master]
    paths:
      - 'lambda/games/cryptogram/**'
      - 'lambda/shared/**'
      - 'lambda/package.json'
      - 'lambda/package-lock.json'
      - 'lambda/scripts/package.sh'
      - '.github/workflows/deploy-lambda-cryptogram.yml'
      - '.github/workflows/_deploy-game-lambda.yml'
  workflow_dispatch:
    inputs:
      skip_schedule:
        description: 'Skip reconciling the EventBridge schedule'
        type: boolean
        default: false

concurrency:
  group: deploy-lambda-cryptogram
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-game-lambda.yml
    with:
      game: cryptogram
      needs_ai: false
      timeout: 120
      memory: 256
      schedule: ${{ vars.CRYPTOGRAM_SCHEDULE || 'cron(20 3 * * ? *)' }}
      skip_schedule: ${{ inputs.skip_schedule || false }}
    secrets: inherit
