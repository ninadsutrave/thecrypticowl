name: Deploy Lambda · Higher or Lower

on:
  push:
    branches: [master]
    paths:
      - 'lambda/games/higher-lower/**'
      - 'lambda/shared/**'
      - 'lambda/package.json'
      - 'lambda/package-lock.json'
      - 'lambda/scripts/package.sh'
      - '.github/workflows/deploy-lambda-higher-lower.yml'
      - '.github/workflows/_deploy-game-lambda.yml'
  workflow_dispatch:
    inputs:
      skip_schedule:
        description: 'Skip reconciling the EventBridge schedule'
        type: boolean
        default: false

concurrency:
  group: deploy-lambda-higher-lower
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-game-lambda.yml
    with:
      game: higher-lower
      needs_ai: false
      timeout: 300
      memory: 256
      schedule: ${{ vars.HIGHER_LOWER_SCHEDULE || 'cron(40 3 * * ? *)' }}
      skip_schedule: ${{ inputs.skip_schedule || false }}
    secrets: inherit
