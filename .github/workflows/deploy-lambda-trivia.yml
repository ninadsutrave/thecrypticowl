name: Deploy Lambda · Trivia

on:
  push:
    branches: [master]
    paths:
      - 'lambda/games/trivia/**'
      - 'lambda/shared/**'
      - 'lambda/package.json'
      - 'lambda/package-lock.json'
      - 'lambda/scripts/package.sh'
      - '.github/workflows/deploy-lambda-trivia.yml'
      - '.github/workflows/_deploy-game-lambda.yml'
  workflow_dispatch:
    inputs:
      skip_schedule:
        description: 'Skip reconciling the EventBridge schedule'
        type: boolean
        default: false

concurrency:
  group: deploy-lambda-trivia
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-game-lambda.yml
    with:
      game: trivia
      needs_ai: true
      timeout: 600
      memory: 256
      schedule: ${{ vars.TRIVIA_SCHEDULE || 'cron(35 3 * * ? *)' }}
      skip_schedule: ${{ inputs.skip_schedule || false }}
    secrets: inherit
